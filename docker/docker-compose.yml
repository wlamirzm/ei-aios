version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. BANCO DE DADOS RELACIONAL (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ei-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ei_aios_secure_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../supabase/migrations/0001_core_schema.sql:/docker-entrypoint-initdb.d/01_core_schema.sql:ro
      - ../supabase/migrations/0002_rls_and_triggers.sql:/docker-entrypoint-initdb.d/02_rls_and_triggers.sql:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 2. CAMADA REST API POSTGREST (Supabase-Compatible API Engine)
  # ----------------------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: ei-postgrest
    restart: always
    environment:
      - PGRST_DB_URI=postgres://postgres:${POSTGRES_PASSWORD:-ei_aios_secure_pass_2026}@postgres:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=postgres
      - PGRST_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    depends_on:
      - postgres
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 3. MOTOR DE AGENTES & WORKER AUTÔNOMO (Agent Core API)
  # ----------------------------------------------------------------------------
  agent-core:
    image: docker-agent-core:latest
    build:
      context: ..
      dockerfile: packages/agent-core/Dockerfile
    container_name: ei-agent-core
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock-key-for-dev}
      - SUPABASE_URL=http://postgrest:3000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoicG9zdGdyZXMiLCJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoyNTAwMDAwMDAwfQ.DE7X6HeS6GhqGPQgUvQDpm8VrHHsVDkKyahIwDEu62s}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - WORKER_POLL_INTERVAL_MS=5000
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.agentcore.rule=Host(`api.${DOMAIN:-eiaios.atendezen.com.br}`)"
        - "traefik.http.routers.agentcore.entrypoints=websecure"
        - "traefik.http.routers.agentcore.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.agentcore.loadbalancer.server.port=4000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.agentcore.rule=Host(`api.${DOMAIN:-eiaios.atendezen.com.br}`)"
      - "traefik.http.routers.agentcore.entrypoints=websecure"
      - "traefik.http.routers.agentcore.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.agentcore.loadbalancer.server.port=4000"
    depends_on:
      - postgres
      - postgrest
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - ei-network
      - network_swarm_public

  # ----------------------------------------------------------------------------
  # 4. FRONTEND COCKPIT DO FUNDADOR (Next.js 15 Web UI)
  # ----------------------------------------------------------------------------
  web-ui:
    image: docker-web-ui:latest
    build:
      context: ..
      dockerfile: packages/web-ui/Dockerfile
    container_name: ei-web-ui
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SUPABASE_URL=https://api.${DOMAIN:-eiaios.atendezen.com.br}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - NEXT_PUBLIC_AGENT_CORE_URL=https://api.${DOMAIN:-eiaios.atendezen.com.br}
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.webui.rule=Host(`app.${DOMAIN:-eiaios.atendezen.com.br}`) || Host(`${DOMAIN:-eiaios.atendezen.com.br}`)"
        - "traefik.http.routers.webui.entrypoints=websecure"
        - "traefik.http.routers.webui.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.webui.loadbalancer.server.port=3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.webui.rule=Host(`app.${DOMAIN:-eiaios.atendezen.com.br}`) || Host(`${DOMAIN:-eiaios.atendezen.com.br}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.webui.loadbalancer.server.port=3000"
    depends_on:
      - agent-core
    networks:
      - ei-network
      - network_swarm_public

  # ----------------------------------------------------------------------------
  # 5. MOTOR DE AUTOMAÇÃO E WEBHOOKS (n8n Self-Hosted)
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ei-n8n
    restart: always
    environment:
      - N8N_HOST=n8n.${DOMAIN:-eiaios.atendezen.com.br}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${DOMAIN:-eiaios.atendezen.com.br}/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=network_swarm_public"
        - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-eiaios.atendezen.com.br}`)"
        - "traefik.http.routers.n8n.entrypoints=websecure"
        - "traefik.http.routers.n8n.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=network_swarm_public"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN:-eiaios.atendezen.com.br}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    networks:
      - ei-network
      - network_swarm_public

volumes:
  postgres_data:
  n8n_data:

networks:
  ei-network:
    driver: overlay
    attachable: true
  network_swarm_public:
    external: true
