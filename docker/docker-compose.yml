version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. REVERSE PROXY & AUTOMATIC SSL (Traefik v3)
  # ----------------------------------------------------------------------------
  traefik:
    image: traefik:v3.0
    container_name: ei-traefik
    restart: always
    command:
      - "--api.insecure=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-admin@atendezen.com.br}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_certs:/letsencrypt"
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 2. BANCO DE DADOS RELACIONAL (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ei-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ei_aios_secure_pass_2026}
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../supabase/migrations/0001_core_schema.sql:/docker-entrypoint-initdb.d/01_core_schema.sql:ro
      - ../supabase/migrations/0002_rls_and_triggers.sql:/docker-entrypoint-initdb.d/02_rls_and_triggers.sql:ro
      - ../supabase/seed.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 3. CAMADA REST API POSTGREST (Supabase-Compatible API Engine)
  # ----------------------------------------------------------------------------
  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: ei-postgrest
    restart: always
    environment:
      - PGRST_DB_URI=postgres://postgres:${POSTGRES_PASSWORD:-ei_aios_secure_pass_2026}@postgres:5432/postgres
      - PGRST_DB_SCHEMA=public
      - PGRST_DB_ANON_ROLE=postgres
      - PGRST_JWT_SECRET=${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 4. MOTOR DE AGENTES & WORKER AUTÔNOMO (Agent Core API)
  # ----------------------------------------------------------------------------
  agent-core:
    build:
      context: ..
      dockerfile: packages/agent-core/Dockerfile
    container_name: ei-agent-core
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=4000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=http://postgrest:3000
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - WORKER_POLL_INTERVAL_MS=5000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agentcore.rule=Host(`api.${DOMAIN}`)"
      - "traefik.http.routers.agentcore.entrypoints=websecure"
      - "traefik.http.routers.agentcore.tls.certresolver=letsencrypt"
      - "traefik.http.services.agentcore.loadbalancer.server.port=4000"
    depends_on:
      postgres:
        condition: service_healthy
      postgrest:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 5. FRONTEND COCKPIT DO FUNDADOR (Next.js 15 Web UI)
  # ----------------------------------------------------------------------------
  web-ui:
    build:
      context: ..
      dockerfile: packages/web-ui/Dockerfile
    container_name: ei-web-ui
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SUPABASE_URL=https://api.${DOMAIN}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-super-secret-jwt-token-with-at-least-32-characters-long}
      - NEXT_PUBLIC_AGENT_CORE_URL=https://api.${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webui.rule=Host(`app.${DOMAIN}`) || Host(`${DOMAIN}`)"
      - "traefik.http.routers.webui.entrypoints=websecure"
      - "traefik.http.routers.webui.tls.certresolver=letsencrypt"
      - "traefik.http.services.webui.loadbalancer.server.port=3000"
    depends_on:
      - agent-core
    networks:
      - ei-network

  # ----------------------------------------------------------------------------
  # 6. MOTOR DE AUTOMAÇÃO E WEBHOOKS (n8n Self-Hosted)
  # ----------------------------------------------------------------------------
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: ei-n8n
    restart: always
    environment:
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - GENERIC_TIMEZONE=America/Sao_Paulo
    volumes:
      - n8n_data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    networks:
      - ei-network

volumes:
  traefik_certs:
  postgres_data:
  n8n_data:

networks:
  ei-network:
    driver: bridge
