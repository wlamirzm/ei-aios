name: CI/CD Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests & Verifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@ei-aios/shared

      - name: Build Agent Core
        run: npm run build --workspace=@ei-aios/agent-core

      - name: Execute Deterministic Regulatory Tests
        run: npm run test --workspace=@ei-aios/agent-core

  deploy:
    name: Deploy to Production VPS (Hostinger)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 44322 }}
          script_stop: true
          command_timeout: 10m
          script: |
            echo "⚡ [CI/CD] Iniciando atualização na VPS Hostinger..."
            cd /opt/ei-aios
            git fetch origin main
            git reset --hard origin/main
            if [ -f .env ]; then
              [ -n "${{ secrets.GEMINI_API_KEY }}" ] && grep -v "^GEMINI_API_KEY=" .env > .env.tmp && mv .env.tmp .env && echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env || true
              [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && grep -v "^AWS_ACCESS_KEY_ID=" .env > .env.tmp && mv .env.tmp .env && echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> .env || true
              [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ] && grep -v "^AWS_SECRET_ACCESS_KEY=" .env > .env.tmp && mv .env.tmp .env && echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> .env || true
              [ -n "${{ secrets.AWS_REGION }}" ] && grep -v "^AWS_REGION=" .env > .env.tmp && mv .env.tmp .env && echo "AWS_REGION=${{ secrets.AWS_REGION }}" >> .env || true
            fi
            bash docker/deploy.sh
            echo "🎉 [CI/CD] Deploy concluído com sucesso!"

