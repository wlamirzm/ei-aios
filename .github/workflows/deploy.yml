name: CI/CD Deploy to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Automated Tests & Verifications
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Package
        run: npm run build --workspace=@ei-aios/shared

      - name: Build Agent Core
        run: npm run build --workspace=@ei-aios/agent-core

      - name: Execute Deterministic Regulatory Tests
        run: npm run test --workspace=@ei-aios/agent-core

  deploy:
    name: Deploy to Production VPS (Hostinger)
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 44322 }}
          envs: GEMINI_API_KEY,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION
          script_stop: true
          command_timeout: 10m
          script: |
            echo "⚡ [CI/CD] Iniciando atualização na VPS Hostinger..."
            cd /opt/ei-aios
            git fetch origin main
            git reset --hard origin/main
            if [ -f .env ]; then
              python3 -c "
import os
env_file = '.env'
updates = {
    'GEMINI_API_KEY': os.environ.get('GEMINI_API_KEY', ''),
    'AWS_ACCESS_KEY_ID': os.environ.get('AWS_ACCESS_KEY_ID', ''),
    'AWS_SECRET_ACCESS_KEY': os.environ.get('AWS_SECRET_ACCESS_KEY', ''),
    'AWS_REGION': os.environ.get('AWS_REGION', ''),
    'LLM_PRIMARY_PROVIDER': 'bedrock',
    'LLM_FALLBACK_ENABLED': 'true'
}
lines = open(env_file, 'r').readlines() if os.path.exists(env_file) else []
data = {}
for l in lines:
    clean = l.strip()
    if clean and not clean.startswith('#') and '=' in clean:
        k, v = clean.split('=', 1)
        data[k] = v
for k, v in updates.items():
    if v:
        data[k] = v
with open(env_file, 'w') as f:
    for k, v in data.items():
        f.write(f'{k}={v}\n')
"
            fi
            bash docker/deploy.sh
            echo "🎉 [CI/CD] Deploy concluído com sucesso!"

